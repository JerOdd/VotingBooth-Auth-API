server.port=8080

# =========================
# Database
# =========================
spring.datasource.url=${AUTH_DATABASE_URL}
#spring.datasource.username=${AUTH_DATABASE_USER}
#spring.datasource.password=${AUTH_DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# =========================
# Flyway
# =========================
spring.flyway.enabled=true

# =========================
# JWT Keys (Kubernetes Secret or env)
# =========================
jwt.private-key=${JWT_PRIVATE_KEY}

# =========================
# Authorization Server
# =========================
spring.security.oauth2.authorizationserver.issuer=${AUTHORIZATION_SERVER_ISSUER}